<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident — DevLens</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="select.js"></script>
<script src="header.js"></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <div id="head"></div>
  <div id="content"></div>
</main>

<script src="app.js"></script>
<script>
(function () {
  const I = window.DevLensI18n;
  I.initLang();
  window.DevLensHeader.build();

  const params = new URLSearchParams(location.search);
  const id = Number(params.get('id'));
  const headEl = document.getElementById('head');
  const contentEl = document.getElementById('content');
  let inc = null;

  if (!id || id <= 0) {
    showError(contentEl, I.t('detail.notfound'));
  } else {
    load();
  }

  async function load() {
    contentEl.innerHTML = '';
    contentEl.appendChild(el('div', 'panel empty', I.t('detail.loading')));
    try {
      inc = await getJSON('/incidents/' + id);
      render();
      loadEvents();
    } catch (err) {
      showError(contentEl, err.message || I.t('analyze.failed'));
    }
  }

  function render() {
    if (!inc) return;

    headEl.innerHTML = '';
    const h1 = el('h1', null, inc.title || (I.t('detail.incident') + ' #' + inc.id));
    headEl.appendChild(h1);

    const badges = el('div');
    badges.style.display = 'flex';
    badges.style.gap = '8px';
    badges.style.flexWrap = 'wrap';
    badges.appendChild(severityBadge(inc.severity));
    badges.appendChild(statusBadge(inc.status));
    if (inc.is_recurring) badges.appendChild(recurringBadge());
    if (inc.category) badges.appendChild(el('span', 'badge', inc.category));
    headEl.appendChild(badges);

    const meta = el('div', 'meta');
    meta.style.marginTop = '12px';
    meta.textContent = I.t('detail.incident') + ' #' + inc.id +
      ' · ' + I.t('detail.created') + ' ' + formatTime(inc.created_at);
    headEl.appendChild(meta);

    contentEl.innerHTML = '';

    // 状态按钮只展示当前状态允许的下一步，非法转移在界面上不可达。
    const next = {
      ANALYZING: [],
      OPEN: ['INVESTIGATING'],
      INVESTIGATING: ['RESOLVED'],
      RESOLVED: [],
      FAILED: [],
    }[inc.status] || [];

    if (next.length) {
      contentEl.appendChild(el('h3', null, I.t('detail.move')));
      const actions = el('div', 'actions');
      next.forEach(s => {
        const btn = el('button', null, s);
        btn.onclick = async () => {
          btn.disabled = true;
          try {
            await patchJSON('/incidents/' + id + '/status', { status: s });
            load();
          } catch (err) {
            btn.disabled = false;
            alert(err.message || I.t('detail.statuschange'));
          }
        };
        actions.appendChild(btn);
      });
      contentEl.appendChild(actions);
    }

    contentEl.appendChild(el('h3', null, I.t('detail.ai')));
    if (!inc.analysis) {
      const panel = el('div', 'panel empty');
      if (inc.status === 'FAILED') {
        panel.textContent = I.t('result.failed.note');
      } else {
        panel.appendChild(el('span', 'spinner'));
        panel.appendChild(document.createTextNode(I.t('analyze.analyzing') + '…'));
        // 分析未完成时继续轮询。
        setTimeout(load, 1500);
      }
      contentEl.appendChild(panel);
    } else {
      const panel = el('div', 'panel');
      renderAnalysis(panel, inc.analysis);
      contentEl.appendChild(panel);
    }

    contentEl.appendChild(el('h3', null, I.t('detail.rawlog')));
    const prePanel = el('div', 'panel');
    const code = el('pre', 'mono', inc.raw_log);
    code.style.whiteSpace = 'pre-wrap';
    code.style.margin = '0';
    prePanel.appendChild(code);
    contentEl.appendChild(prePanel);

    contentEl.appendChild(el('h3', null, I.t('detail.related')));
    const relatedBox = el('div', 'panel empty', I.t('detail.loading'));
    relatedBox.id = 'related';
    contentEl.appendChild(relatedBox);
    loadRelated();
  }

  async function loadRelated() {
    const box = document.getElementById('related');
    if (!box) return;
    try {
      const res = await getJSON('/incidents/' + id + '/related');
      const items = res.items || [];
      if (!items.length) {
        box.className = 'panel empty';
        box.textContent = I.t('result.norelated');
        return;
      }
      box.className = 'panel';
      box.innerHTML = '';
      // 匹配原因（exact / similar）由共用渲染器加标记，
      // 避免 analyze 页与 detail 页出现不同的展示。
      box.appendChild(renderRelatedList(items));
    } catch (err) {
      box.className = 'panel empty';
      box.textContent = I.t('result.relatedfailed');
    }
  }

  async function loadEvents() {
    try {
      const res = await getJSON('/incidents/' + id + '/events');
      const items = res.items || [];
      if (!items.length) return;

      const old = document.getElementById('timeline-block');
      if (old) old.remove();

      const block = el('div');
      block.id = 'timeline-block';
      block.appendChild(el('h3', null, I.t('detail.timeline')));

      const ul = el('ul', 'timeline');
      items.forEach(e => {
        const li = el('li');
        li.appendChild(el('div', null, describeEvent(e)));
        li.appendChild(el('div', 'when', formatTime(e.created_at)));
        ul.appendChild(li);
      });
      block.appendChild(ul);
      contentEl.appendChild(block);
    } catch (_) {
      // 时间线取不到不影响主要内容。
    }
  }

  function describeEvent(e) {
    switch (e.event_type) {
      case 'created': return I.t('detail.event.created');
      case 'analysis_completed': return I.t('detail.event.analysis_done');
      case 'analysis_failed': return I.t('detail.event.analysis_failed');
      case 'status_changed':
        return I.t('detail.event.status', { from: e.from_status || '?', to: e.to_status || '?' });
      default: return e.event_type;
    }
  }

  onLangChange(() => {
    document.title = I.t('detail.incident') + ' — DevLens';
    if (!inc) return;
    render();
    loadEvents();
  });
})();
</script>
</body>
</html>
