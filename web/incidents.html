<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidents — DevLens</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="select.js"></script>
<script src="header.js"></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <h1 data-i18n="list.title"></h1>

  <div class="actions">
    <span id="status-filter"></span>
    <span id="severity-filter"></span>
    <button id="refresh" data-i18n="list.refresh"></button>
  </div>

  <div id="content"></div>
  <div id="more" class="actions"></div>
</main>

<script src="app.js"></script>
<script>
(function () {
  const I = window.DevLensI18n;
  I.initLang();
  window.DevLensHeader.build();

  const contentEl = document.getElementById('content');
  const moreEl = document.getElementById('more');

  // 状态与严重程度的取值是后端枚举，不随语言变化，
  // 只有"全部"这一项的文案需要翻译。
  const STATUSES = ['ANALYZING', 'OPEN', 'INVESTIGATING', 'RESOLVED', 'FAILED'];
  const SEVERITIES = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'];

  let statusValue = '';
  let severityValue = '';
  let cursor = null;
  let all = [];

  function statusOptions() {
    return [{ value: '', label: I.t('list.status') }]
      .concat(STATUSES.map(s => ({ value: s, label: s })));
  }
  function severityOptions() {
    return [{ value: '', label: I.t('list.severity') }]
      .concat(SEVERITIES.map(s => ({ value: s, label: s })));
  }

  const statusSelect = window.DevLensSelect.create({
    mount: document.getElementById('status-filter'),
    value: '',
    options: statusOptions(),
    ariaLabel: I.t('list.status'),
    onChange: (v) => { statusValue = v; load(true); },
  });

  const severitySelect = window.DevLensSelect.create({
    mount: document.getElementById('severity-filter'),
    value: '',
    options: severityOptions(),
    ariaLabel: I.t('list.severity'),
    onChange: (v) => { severityValue = v; load(true); },
  });

  function query() {
    const p = new URLSearchParams();
    p.set('limit', '20');
    if (statusValue) p.set('status', statusValue);
    if (severityValue) p.set('severity', severityValue);
    if (cursor) p.set('cursor', cursor);
    return p.toString();
  }

  async function load(reset) {
    if (reset) { cursor = null; all = []; }
    contentEl.innerHTML = '';
    contentEl.appendChild(el('div', 'panel empty', I.t('list.loading')));
    try {
      const res = await getJSON('/incidents?' + query());
      all = all.concat(res.items || []);
      cursor = res.next_cursor || null;
      render();
    } catch (err) {
      showError(contentEl, err.message || I.t('list.failed'));
    }
  }

  function render() {
    if (!all.length) {
      contentEl.innerHTML = '';
      contentEl.appendChild(el('div', 'panel empty', I.t('list.empty')));
      moreEl.innerHTML = '';
      return;
    }

    const table = el('table');
    const thead = el('thead');
    const htr = el('tr');
    [
      I.t('list.col.id'), I.t('list.col.title'), I.t('list.col.severity'),
      I.t('list.col.status'), I.t('list.col.tags'), '',
    ].forEach(h => htr.appendChild(el('th', null, h)));
    thead.appendChild(htr);
    table.appendChild(thead);

    const tbody = el('tbody');
    all.forEach(inc => {
      const tr = el('tr');
      tr.className = 'row';
      tr.tabIndex = 0;
      // 整行可点。ID 仍然渲染成链接，这样中键、右键"在新标签打开"、
      // 复制链接都还能用；行点击只是把命中区域扩大到整行。
      tr.dataset.href = 'detail.html?id=' + inc.id;

      const idTd = el('td');
      idTd.appendChild(linkIncident(inc.id));
      tr.appendChild(idTd);

      tr.appendChild(el('td', null, inc.title || '—'));

      const sevTd = el('td');
      sevTd.appendChild(severityBadge(inc.severity));
      tr.appendChild(sevTd);

      const stTd = el('td');
      stTd.appendChild(statusBadge(inc.status));
      tr.appendChild(stTd);

      // 模型的自由文本标签，不做归一化。
      tr.appendChild(el('td', null, inc.category || '—'));

      const flagTd = el('td');
      if (inc.is_recurring) flagTd.appendChild(recurringBadge());
      tr.appendChild(flagTd);

      tbody.appendChild(tr);
    });

    // 行点击与键盘操作。
    //
    // 点在链接上时让浏览器自己处理，避免插入一条重复的历史记录。
    tbody.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const row = e.target.closest('tr[data-href]');
      if (row) location.href = row.dataset.href;
    });
    tbody.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('a')) return;
      const row = e.target.closest('tr[data-href]');
      if (!row) return;
      e.preventDefault();
      location.href = row.dataset.href;
    });
    table.appendChild(tbody);

    contentEl.innerHTML = '';
    contentEl.appendChild(table);

    moreEl.innerHTML = '';
    if (cursor) {
      const btn = el('button', null, I.t('list.more'));
      btn.onclick = () => load(false);
      moreEl.appendChild(btn);
    }
  }

  document.getElementById('refresh').onclick = () => load(true);

  onLangChange(() => {
    document.title = I.t('list.title') + ' — DevLens';
    statusSelect.setOptions(statusOptions());
    severitySelect.setOptions(severityOptions());
    render();
  });

  load(true);
})();
</script>
</body>
</html>
