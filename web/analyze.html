<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyze — DevLens</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="select.js"></script>
<script src="header.js"></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <h1 data-i18n="analyze.title"></h1>

  <div class="split">
    <section>
      <h3 data-i18n="analyze.log"></h3>
      <textarea id="log" data-i18n-placeholder="analyze.placeholder"></textarea>
      <div class="field-note">
        <span id="size-hint" class="size-hint"></span>
      </div>
      <p class="redact-note" data-i18n="analyze.redact"></p>
      <div class="actions">
        <button id="submit" class="btn-primary" data-i18n="analyze.submit"></button>
        <button id="sample" data-i18n="analyze.sample"></button>
        <button id="clear" data-i18n="analyze.clear"></button>
      </div>
      <div id="input-error"></div>
    </section>

    <section>
      <h3 data-i18n="analyze.result"></h3>
      <div id="result" class="panel empty" data-i18n="analyze.empty"></div>
    </section>
  </div>
</main>

<script src="app.js"></script>
<script>
(function () {
  const I = window.DevLensI18n;
  I.initLang();
  window.DevLensHeader.build();

  const SAMPLE = [
    '2026-09-18 14:32:51',
    'POST /api/payment',
    '',
    'ERROR:',
    'context deadline exceeded',
    '',
    'stack:',
    'goroutine 231 [IO wait]:',
    'database/sql.(*DB).conn(...)',
    '\t/payment/db/db.go:142 +0x1a',
    '\t/payment/handler/pay.go:88 +0x2b',
    'context deadline exceeded while waiting for database connection',
    'active connections: 20',
    'pool size: 20',
  ].join('\n');

  const logEl = document.getElementById('log');
  const resultEl = document.getElementById('result');
  const inputErrorEl = document.getElementById('input-error');
  const submitBtn = document.getElementById('submit');

  const params = new URLSearchParams(location.search);
  if (params.get('sample') === '1') logEl.value = SAMPLE;

  // 日志字段的上限，与后端 domain.MaxLogBytes 保持一致。
  const MAX_LOG_BYTES = 64 * 1024;

  const sizeHintEl = document.getElementById('size-hint');

  // byteLength 用 TextEncoder 而不是 log.length。
  //
  // length 数的是 UTF-16 码元，一个中文字符在 UTF-8 里占 3 字节。
  // 用 length 判断会让中文日志的上限实际变成约 21KB。
  const encoder = new TextEncoder();
  function byteLength(s) {
    return encoder.encode(s).length;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    return (bytes / 1024).toFixed(1) + ' KB';
  }

  // updateSizeHint 在输入时实时显示占用，超限时给出视觉提示。
  //
  // 前端先挡一道，避免用户白跑一次网络请求；后端仍会再校验一次
  //（前端校验不可信）。
  function updateSizeHint() {
    const size = byteLength(logEl.value);
    const over = size > MAX_LOG_BYTES;

    sizeHintEl.textContent = I.t(over ? 'analyze.overlimit' : 'analyze.sizeok', {
      size: formatSize(size),
    });
    sizeHintEl.classList.toggle('over', over);
    submitBtn.disabled = over;
  }

  logEl.addEventListener('input', updateSizeHint);

  let pollTimer = null;
  let currentId = null;
  let currentData = null;
  let elapsed = 0;

  document.getElementById('sample').onclick = () => { logEl.value = SAMPLE; };

  document.getElementById('clear').onclick = () => {
    logEl.value = '';
    stopPolling();
    currentId = null;
    currentData = null;
    inputErrorEl.innerHTML = '';
    resultEl.className = 'panel empty';
    resultEl.textContent = I.t('analyze.empty');
    history.replaceState(null, '', 'analyze.html');
    updateSizeHint();
  };

  submitBtn.onclick = async () => {
    const log = logEl.value;
    inputErrorEl.innerHTML = '';

    if (log.trim().length === 0) {
      showError(inputErrorEl, I.t('analyze.needlog'));
      return;
    }
    if (byteLength(log) > MAX_LOG_BYTES) {
      showError(inputErrorEl, I.t('analyze.toolong'));
      return;
    }

    stopPolling();
    submitBtn.disabled = true;
    resultEl.className = 'panel';
    resultEl.innerHTML = '';
    resultEl.appendChild(spinnerLine(I.t('analyze.analyzing') + '…'));

    try {
      // 把界面语言一并传过去，让诊断内容与界面语言一致。
      const res = await postJSON('/incidents/analyze?lang=' + encodeURIComponent(I.apiLang()), { log });
      history.replaceState(null, '', 'analyze.html?id=' + res.id);
      currentId = res.id;
      currentData = null;
      render();
      startPolling(res.id);
    } catch (err) {
      submitBtn.disabled = false;
      showError(resultEl, errorText(err));
    }
  };

  function errorText(err) {
    if (err.code === 'INVALID_LOG') return I.t('analyze.rejected') + err.message;
    if (err.code === 'RATE_LIMITED') return I.t('analyze.ratelimited');
    // 请求体在中间件层就被拒绝，这时没有经过字段校验，
    // 所以要单独给一条与"日志字段过长"不同的文案。
    if (err.code === 'PAYLOAD_TOO_LARGE' || err.status === 413) return I.t('analyze.payload');
    return err.message || I.t('analyze.failed');
  }

  function startPolling(id) {
    elapsed = 0;
    const tick = async () => {
      elapsed += 1;
      try {
        const inc = await getJSON('/incidents/' + id);
        currentData = inc;
        if (inc.analysis || inc.status === 'FAILED') {
          stopPolling();
          submitBtn.disabled = false;
          render();
          return;
        }
        if (elapsed >= 60) {
          stopPolling();
          submitBtn.disabled = false;
          render();
          return;
        }
        render();
      } catch (err) {
        stopPolling();
        submitBtn.disabled = false;
        showError(resultEl, errorText(err));
      }
    };
    tick();
    pollTimer = setInterval(tick, 1000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function render() {
    if (!currentId) return;
    if (!currentData) {
      resultEl.className = 'panel';
      resultEl.innerHTML = '';
      resultEl.appendChild(spinnerLine(I.t('analyze.analyzing') + '…'));
      return;
    }
    renderIncident(currentId, currentData);
  }

  function renderIncident(id, data) {
    resultEl.className = 'panel';
    resultEl.innerHTML = '';

    const head = el('div');
    const title = el('div', null, data.title || (I.t('detail.incident') + ' #' + id));
    title.style.fontSize = '19px';
    title.style.fontWeight = '750';
    title.style.marginBottom = '10px';
    head.appendChild(title);

    const badges = el('div');
    badges.style.display = 'flex';
    badges.style.gap = '8px';
    badges.style.flexWrap = 'wrap';
    badges.appendChild(severityBadge(data.severity));
    badges.appendChild(statusBadge(data.status));
    if (data.is_recurring) badges.appendChild(recurringBadge());
    if (data.category) badges.appendChild(el('span', 'badge', data.category));
    head.appendChild(badges);
    resultEl.appendChild(head);

    const meta = el('div', 'meta');
    meta.style.marginTop = '12px';
    meta.appendChild(linkIncident(id, I.t('result.view') + ' #' + id));
    meta.appendChild(document.createTextNode(' · ' + formatTime(data.created_at)));
    resultEl.appendChild(meta);

    if (data.status === 'FAILED') {
      resultEl.appendChild(el('div', 'alert error', I.t('result.failed.note')));
    }

    if (!data.analysis) {
      if (elapsed >= 60) {
        resultEl.appendChild(el('div', 'alert info', I.t('analyze.still')));
      } else {
        resultEl.appendChild(spinnerLine(I.t('analyze.analyzing') + '… ' + elapsed + 's'));
      }
      return;
    }

    renderAnalysis(resultEl, data.analysis);

    if (data.related_incidents && data.related_incidents.length) {
      resultEl.appendChild(el('h3', null, I.t('result.related')));
      const ul = el('ul', 'plain');
      data.related_incidents.forEach(r => {
        const li = el('li');
        li.appendChild(linkIncident(r.id));
        li.appendChild(document.createTextNode(' ' + (r.title || '')));
        if (r.severity) li.appendChild(document.createTextNode(' · ' + r.severity));
        ul.appendChild(li);
      });
      resultEl.appendChild(ul);
    }
  }

  // 语言切换后文案要跟着变，正在展示的结果需要重绘。
  onLangChange(() => {
    document.title = I.t('analyze.title') + ' — DevLens';
    if (currentId && currentData) render();
    else if (!currentId) {
      resultEl.className = 'panel empty';
      resultEl.textContent = I.t('analyze.empty');
    }
  });

  // 初始化时显示一次，让用户一眼看到当前占用。
  updateSizeHint();

  if (params.get('id')) {
    const id = Number(params.get('id'));
    if (id > 0) {
      submitBtn.disabled = true;
      currentId = id;
      resultEl.className = 'panel';
      resultEl.innerHTML = '';
      resultEl.appendChild(spinnerLine(I.t('analyze.loading') + '…'));
      startPolling(id);
    }
  }
})();
</script>
</body>
</html>
