<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevLens</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="select.js"></script>
<script src="header.js"></script>
</head>
<body>
<header id="site-header"></header>

<main>
  <h1 data-i18n="landing.title"></h1>
  <p class="lede" data-i18n="landing.lede"></p>

  <div class="actions">
    <a class="btn btn-primary" href="analyze.html" data-i18n="landing.cta.analyze"></a>
    <a class="btn" href="incidents.html" data-i18n="landing.cta.browse"></a>
  </div>

  <div class="cards">
    <div class="card">
      <h3 data-i18n="landing.card.diagnosis.title"></h3>
      <p data-i18n="landing.card.diagnosis.body"></p>
    </div>
    <div class="card">
      <h3 data-i18n="landing.card.related.title"></h3>
      <p data-i18n="landing.card.related.body"></p>
    </div>
    <div class="card">
      <h3 data-i18n="landing.card.history.title"></h3>
      <p data-i18n="landing.card.history.body"></p>
    </div>
  </div>

  <h2 data-i18n="landing.sample.title"></h2>
  <div class="panel">
    <pre class="mono" id="sample-log"></pre>
    <div class="actions">
      <a class="btn btn-primary" id="sample-link" data-i18n="landing.sample.load"></a>
    </div>
  </div>
</main>

<script>
(function () {
  const I = window.DevLensI18n;
  I.initLang();
  window.DevLensHeader.build();

  document.getElementById('sample-log').textContent =
    '2026-09-18 14:32:51\n' +
    'POST /api/payment\n\n' +
    'ERROR: context deadline exceeded\n\n' +
    'stack:\n' +
    'goroutine 231 [IO wait]:\n' +
    'database/sql.(*DB).conn(...)\n' +
    '\t/payment/db/db.go:142 +0x1a';

  document.getElementById('sample-link').href = 'analyze.html?sample=1';
})();
</script>
</body>
</html>
